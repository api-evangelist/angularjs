description: >-
  AngularJS (Angular.js, version 1.x) is the original Angular JavaScript
  framework for building dynamic single-page web applications, created by Google.
  It introduced MVC patterns to front-end development with two-way data binding,
  dependency injection, directives, filters, services, and controllers.
  AngularJS reached End of Life on December 31, 2021 and is no longer actively
  maintained. Developers should migrate to the modern Angular framework (v14+).
